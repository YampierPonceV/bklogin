---
- name: Desplegar Backend Node.js con PM2
  hosts: webserver
  become: yes
  vars:
    app_port: "3000"

  tasks:
    - name: Instalar Git, Curl, Node.js y npm
      apt:
        name:
          - git
          - curl
          - nodejs
          - npm
        state: present
        update_cache: yes

    - name: Instalar PM2 globalmente
      npm:
        name: pm2
        global: yes

    - name: Crear directorio de la aplicación
      file:
        path: /var/www/backend
        state: directory
        owner: deployer
        group: deployer
        mode: "0755"

    - name: Clonar o actualizar el repositorio
      git:
        repo: "https://github.com/YampierPonceV/bklogin.git"
        dest: /var/www/backend
        version: main
        force: yes
      become: no

    - name: Crear archivo .env usando secretos de Ansible Vault
      copy:
        dest: /var/www/backend/.env
        content: |
          PORT={{ app_port }}
          DB_HOST={{ vault_db_host }}
          DB_PORT={{ vault_db_port }}
          DB_NAME={{ vault_db_name }}
          DB_USER={{ vault_db_user }}
          DB_PASSWORD={{ vault_db_password }}
        owner: deployer
        group: deployer
        mode: "0600"

    - name: Instalar dependencias del proyecto (npm install)
      npm:
        path: /var/www/backend
      become: no

    - name: Iniciar o recargar la aplicación con PM2
      command: pm2 startOrReload ecosystem.config.js --env production
      args:
        chdir: /var/www/backend
      become: no

    - name: Guardar la lista de procesos de PM2
      command: pm2 save
      become: no
    # ==========================================
    # INSTALACIÓN Y CONFIGURACIÓN DE NODE EXPORTER
    # ==========================================
    - name: Crear usuario de sistema para Node Exporter
      user:
        name: node_exporter
        shell: /bin/false
        system: yes

    - name: Descargar e instalar Node Exporter
      unarchive:
        src: https://github.com/prometheus/node_exporter/releases/download/v1.8.2/node_exporter-1.8.2.linux-amd64.tar.gz
        dest: /tmp
        remote_src: yes

    - name: Copiar binario de Node Exporter a /usr/local/bin
      copy:
        src: /tmp/node_exporter-1.8.2.linux-amd64/node_exporter
        dest: /usr/local/bin/node_exporter
        owner: node_exporter
        group: node_exporter
        mode: "0755"
        remote_src: yes

    - name: Crear archivo de servicio systemd para Node Exporter
      copy:
        dest: /etc/systemd/system/node_exporter.service
        content: |
          [Unit]
          Description=Node Exporter
          Wants=network-online.target
          After=network-online.target

          [Service]
          User=node_exporter
          Group=node_exporter
          Type=simple
          ExecStart=/usr/local/bin/node_exporter

          [Install]
          WantedBy=multi-user.target
        mode: "0644"

    - name: Iniciar y habilitar Node Exporter
      systemd:
        name: node_exporter
        state: started
        enabled: yes
        daemon_reload: yes
